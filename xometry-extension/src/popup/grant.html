<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xometry Tools · Salesforce access</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px/1.45 "Segoe UI", Arial, sans-serif; color: #181818; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; color: #514f4d; }
    button { height: 32px; padding: 0 16px; border: 1px solid #0176d3; border-radius: 4px; background: #0176d3;
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 12px; min-height: 20px; }
    .ok { color: #2e844a; }
    .bad { color: #8e030f; }
  </style>
</head>
<body>
  <h1>Salesforce access</h1>
  <p>Child case creates cases through the Salesforce API with your own Salesforce session.
    Chrome asks you to allow it once.</p>
  <button type="button" id="grant">Allow Salesforce access</button>
  <div id="status"></div>
  <script src="grant.js"></script>
</body>
</html>
