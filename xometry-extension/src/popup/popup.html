<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Xometry Tools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img src="../../icons/icon32.png" alt="" width="18" height="18" />
          Xometry Tools
        </div>
        <div id="erp-status" class="erp-status" aria-live="polite"></div>
      </header>

      <div class="layout">
        <nav id="sites" class="sites" aria-label="Sites"></nav>
        <main class="main">
          <div class="site-head">
            <h1 id="site-name"></h1>
            <span id="site-host" class="muted"></span>
          </div>
          <div id="scripts" class="scripts"></div>
        </main>
      </div>

      <footer class="footer">
        <span class="muted"><span id="version"></span> · © 2026 by Artem Kolchyk. All rights reserved</span>
        <span id="message" aria-live="polite"></span>
      </footer>
    </div>

    <script src="../common/registry.js"></script>
    <script src="../common/settings.js"></script>
    <script src="../common/storage-cache.js"></script>
    <script src="../common/highlight-rules.js"></script>
    <script src="../common/quick-text-buttons.js"></script>
    <script src="highlight-editor.js"></script>
    <script src="auto-refresh-editor.js"></script>
    <script src="quick-text-editor.js"></script>
    <script src="settings-page.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
